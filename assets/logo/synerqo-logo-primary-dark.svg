<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" role="img" aria-label="Synerqo">
  <title>Synerqo — Logo principal (fond sombre)</title>
  <desc>Marque combinée : symbole Apex + wordmark. Pour fonds graphite/sombres.</desc>

  <!-- Symbole Apex : deux lignes ascendantes convergeant vers un point en émeraude -->
  <g id="apex-mark">
    <line x1="14" y1="78" x2="46" y2="22" stroke="#00C896" stroke-width="4" stroke-linecap="round"/>
    <line x1="78" y1="78" x2="46" y2="22" stroke="#00C896" stroke-width="4" stroke-linecap="round"/>
    <circle cx="46" cy="22" r="7" fill="#00C896"/>
    <circle cx="46" cy="22" r="14" fill="none" stroke="#00C896" stroke-width="0.7" opacity="0.3"/>
  </g>

  <!-- Wordmark : Georgia 38px, tracking 0.32em, "QO" en émeraude -->
  <text x="118" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="38" letter-spacing="12" font-weight="400">
    <tspan fill="#EFF3F8">SYNER</tspan><tspan fill="#00C896">QO</tspan>
  </text>
</svg>
