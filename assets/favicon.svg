<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Synerqo">
  <title>Synerqo — Favicon</title>
  <desc>Favicon avec fond graphite. Strokes renforcés pour visibilité à 16-32px.</desc>

  <!-- Fond graphite arrondi -->
  <rect width="64" height="64" rx="12" fill="#0D0F12"/>

  <!-- Symbole Apex (proportions ajustées pour petites tailles) -->
  <line x1="14" y1="50" x2="32" y2="14" stroke="#00C896" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="32" y2="14" stroke="#00C896" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="14" r="6" fill="#00C896"/>
</svg>
