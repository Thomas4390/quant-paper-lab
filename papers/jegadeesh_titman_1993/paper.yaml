published: 2026-07-25

one_liner: >-
  Stocks that beat the market over the past year kept beating it over the following months.
  Reproduced on the paper's own weighting, the result comes back within 0.03 points of the
  published number. What happened after 2009 is a harder question than it looks.

# One sentence linkedin-connector can drop into a message. Written to stand alone.
quotable: >-
  Reproducing Jegadeesh and Titman on equal weighted deciles gives 1.33 percent a month over
  their 1965 to 1989 sample, against the 1.31 percent they published.

